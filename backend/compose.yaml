services:
  db:
    image: postgres:16-alpine
    container_name: pios-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pios}
      POSTGRES_USER: ${POSTGRES_USER:-pios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pios_local_only}
    ports:
      - "5432:5432"
    volumes:
      - pios-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pios} -d ${POSTGRES_DB:-pios}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pios-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pios}
      DB_USERNAME: ${POSTGRES_USER:-pios}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pios_local_only}
      APP_JWT_SECRET_BASE64: ${APP_JWT_SECRET_BASE64:?Set APP_JWT_SECRET_BASE64 in .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"

volumes:
  pios-postgres-data:
