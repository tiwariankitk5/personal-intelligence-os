spring:
  datasource:
    url: jdbc:h2:mem:pios_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
app:
  jwt:
    secret-base64: cGlvcy10ZXN0LXNlY3JldC1rZXktMzItYnl0ZXMhISE=
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:3000
  encryption:
    key-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  storage:
    path: ./target/test-uploads
management:
  endpoints:
    web:
      exposure:
        include: health
