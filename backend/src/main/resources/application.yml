spring:
  application:
    name: personal-intelligence-os
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pios}
    username: ${DB_USERNAME:pios}
    password: ${DB_PASSWORD:pios_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${APP_SESSION_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

app:
  auth-abuse:
    login-ip-limit: ${PIOS_AUTH_LOGIN_IP_LIMIT:30}
    registration-ip-limit: ${PIOS_AUTH_REGISTER_IP_LIMIT:5}
    account-login-limit: ${PIOS_AUTH_ACCOUNT_LOGIN_LIMIT:10}
    failed-login-limit: ${PIOS_AUTH_FAILED_LOGIN_LIMIT:5}
    failure-window-seconds: ${PIOS_AUTH_FAILURE_WINDOW_SECONDS:900}
    cooldown-seconds: ${PIOS_AUTH_COOLDOWN_SECONDS:60}
  ai:
    allow-local-endpoints: ${PIOS_ALLOW_LOCAL_MODELS:false}
    allowed-cloud-hosts: ${PIOS_ALLOWED_AI_HOSTS:api.openai.com,openrouter.ai,api.groq.com,api.deepseek.com,api.mistral.ai}
  jwt:
    secret-base64: ${APP_JWT_SECRET_BASE64}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:43200000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    path: ${PIOS_STORAGE_PATH:./data/uploads}
  encryption:
    key-base64: ${PIOS_ENCRYPTION_KEY}
  limits:
    max-upload-bytes: ${PIOS_MAX_UPLOAD_BYTES:26214400}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
