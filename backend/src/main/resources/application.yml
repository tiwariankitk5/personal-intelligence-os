spring:
  application:
    name: personal-intelligence-os
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pios}
    username: ${DB_USERNAME:pios}
    password: ${DB_PASSWORD:pios_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret-base64: ${APP_JWT_SECRET_BASE64}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:43200000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    path: ${PIOS_STORAGE_PATH:./data/uploads}
  encryption:
    key-base64: ${PIOS_ENCRYPTION_KEY}
  limits:
    max-upload-bytes: ${PIOS_MAX_UPLOAD_BYTES:26214400}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
