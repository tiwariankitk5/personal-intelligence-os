spring:
  config:
    import: optional:configtree:/run/secrets/
server:
  # Backend ports MUST be private/loopback; only the trusted proxy may reach them.
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      cookie:
        secure: true
app:
  cors:
    allowed-origins: ${PIOS_PUBLIC_ORIGIN}
  ai:
    allow-local-endpoints: false
management:
  endpoint:
    health:
      probes:
        enabled: true
