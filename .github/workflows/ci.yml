name: Verify PIOS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pios
          POSTGRES_USER: pios
          POSTGRES_PASSWORD: pios-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pios -d pios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/pios
      DB_USERNAME: pios
      DB_PASSWORD: pios-ci-only
      APP_JWT_SECRET_BASE64: cGlvcy10ZXN0LXNlY3JldC1rZXktMzItYnl0ZXMhISE=
      PIOS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_SESSION_COOKIE_SECURE: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify migrations and account-scoped API flows
        run: |
          java -jar target/personal-intelligence-os-0.1.0-SNAPSHOT.jar > target/smoke-backend.log 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat target/smoke-backend.log
            exit 1
          fi
          node ../scripts/smoke-test.mjs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
