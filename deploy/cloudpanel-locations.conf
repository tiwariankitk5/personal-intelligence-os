# REVIEW before applying. Replace the existing PHP/Varnish locations for the
# PIOS site; do not append duplicate `location /` blocks. Keep CloudPanel's TLS,
# ACME challenge and www redirects. Do not expose backend/database ports.
# The hosting owner must validate `nginx -t` and preserve a vhost rollback copy.
location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:8180;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_cache off;
    client_max_body_size 26m;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
}
location ^~ /_next/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_cache off;
    proxy_read_timeout 75s;
}
# Headers belong at the HTTPS server level (not in a cache layer).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
