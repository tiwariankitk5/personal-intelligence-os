services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pios
      POSTGRES_USER: pios
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PIOS_DB_PORT:-5432}:5432"
    volumes:
      - pios-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pios -d pios"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend-python/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/pios
      DB_USERNAME: pios
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_JWT_SECRET_BASE64: ${APP_JWT_SECRET_BASE64:?Set APP_JWT_SECRET_BASE64 in .env}
      APP_JWT_EXPIRATION_MS: 43200000
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${PIOS_FRONTEND_PORT:-3000}
      APP_SESSION_COOKIE_SECURE: "false"
      PIOS_ALLOW_LOCAL_MODELS: "true"
      PIOS_ENCRYPTION_KEY: ${PIOS_ENCRYPTION_KEY:?Set PIOS_ENCRYPTION_KEY in .env}
      PIOS_STORAGE_PATH: /app/data/uploads
      PIOS_MAX_UPLOAD_BYTES: 26214400
      PIOS_AUTH_LOGIN_IP_LIMIT: ${PIOS_AUTH_LOGIN_IP_LIMIT:-30}
      PIOS_AUTH_REGISTER_IP_LIMIT: ${PIOS_AUTH_REGISTER_IP_LIMIT:-5}
      PIOS_AUTH_ACCOUNT_LOGIN_LIMIT: ${PIOS_AUTH_ACCOUNT_LOGIN_LIMIT:-10}
      PIOS_AUTH_FAILED_LOGIN_LIMIT: ${PIOS_AUTH_FAILED_LOGIN_LIMIT:-5}
      PIOS_AUTH_FAILURE_WINDOW_SECONDS: ${PIOS_AUTH_FAILURE_WINDOW_SECONDS:-900}
      PIOS_AUTH_COOLDOWN_SECONDS: ${PIOS_AUTH_COOLDOWN_SECONDS:-60}
      PIOS_RAG_WORKER_ENABLED: ${PIOS_RAG_WORKER_ENABLED:-true}
      PIOS_RAG_WORKER_DELAY_MS: ${PIOS_RAG_WORKER_DELAY_MS:-3000}
    ports:
      - "127.0.0.1:${PIOS_BACKEND_PORT:-8080}:8080"
    volumes:
      - pios-uploads:/app/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${PIOS_BACKEND_PORT:-8080}/api/v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PIOS_FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pios-postgres-data:
  pios-uploads:
