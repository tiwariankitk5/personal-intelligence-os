services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pios-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pios
      POSTGRES_USER: pios
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pios-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pios -d pios"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: pios-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/pios
      DB_USERNAME: pios
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_JWT_SECRET_BASE64: ${APP_JWT_SECRET_BASE64:?Set APP_JWT_SECRET_BASE64 in .env}
      APP_JWT_EXPIRATION_MS: 43200000
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      PIOS_ENCRYPTION_KEY: ${PIOS_ENCRYPTION_KEY:?Set PIOS_ENCRYPTION_KEY in .env}
      PIOS_STORAGE_PATH: /app/data/uploads
      PIOS_MAX_UPLOAD_BYTES: 26214400
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - pios-uploads:/app/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    container_name: pios-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  pios-postgres-data:
  pios-uploads:
